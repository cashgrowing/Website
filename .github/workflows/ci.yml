# Runs the same gate Vercel runs, on the same Node version Vercel uses.
#
# This exists because a build passed locally on Node 26 and failed on Vercel's
# Node 22 for six commits before anyone noticed: `node --test <dir>` only scans
# a directory on newer Node. Testing on one version and deploying on another is
# how that goes unseen.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is what Vercel builds with; 24 catches anything version-specific.
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npx next build
